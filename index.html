<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien or Earth? | ARSET</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Start Screen -->

    <div id="home-screen" class="home-screen crt-effect">
        <img src="https://stardance.hackclub.com/assets/landing/hero/nasa-hero-e6195581.png" class="stardance-bg" alt="Stardance Shuttle">

        <div class="logo-container">
            <img src="https://www.logo.wine/a/logo/NASA/NASA-Logo.wine.svg" alt="NASA Logo" class="nasa-logo">
        </div>

        <div class ="title-container">
            <span class="text-alien">ALIEN</span>
            <span class="text-or">OR</span>
            <span class="text-earth">EARTH?</span>
        </div>

        <p class="subtitle">NASA SATELLITE QUIZ</p>

        <div class="briefing">
            <p class="blink-text">> CONNECTING TO NASA...</p>
            <p>> 7 SECONDS PER SCAN.</p>
            <p>> DON'T BLINK.</p>
        </div>

        <button id="btn-start" class="btn btn-start">LAUNCH</button>

        <img id="rocket" src="rocket.png" class="rocket" alt="Launch">
    </div>

    <div id = "loading-overlay" class="overlay">
        <div class="loader-text">GRABBING NASA DATA...</div>
    </div>

    <!--Main game-->
    <header class="hud-header">
        <div class="timer-container">
            <div id="timer-bar" class="timer-bar"></div>
            <span id="timer-text" class="timer-text">7s</span>
        </div>
        <div class="scores-group">
            <div class="stat-box">SCORE: <span id="score-val" class="neon-text">0</span></div>
            <div class="stat-box">MAX: <span id="high-score-val" class="neon-text">0</span></div>
        </div>
    </header>

    <main class="game-board">
        <div class="image-frame">
            <img id="game-image" src="" alt="Satellite Feed">
        </div>

        <div class="controls">
            <button id="btn-earth" class="btn btn-earth">🌍 EARTH</button>
            <button id="btn-alien" class="btn btn-alien">🪐 ALIEN</button>
        </div>
    </main>

    <!-- After Guessing-->
    <div id="reveal-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="reveal-title">TARGET IDENTIFIED</h2>
            <p id="reveal-score" class="reveal-score"></p>

            <div class="data-box">
                <h3 id="reveal-sensor" class="neon-text"></h3>
                <p id="reveal-desc"></p>
            </div>

            <div class="modal-buttons">
                <button id="btn-next" class="btn btn-next">INITIATE NEXT MISSION ➔</button>
                <button id="btn-home" class="btn-home">« RETURN TO BASE</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
